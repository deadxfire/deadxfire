<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="50%" stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <!-- Rainbow Ribbon Accent Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="75%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Glowing Cyber Blue Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for soft blur -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
    </filter>

    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .title-name { font-weight: 800; font-size: 42px; fill: #ffffff; letter-spacing: -0.5px; }
      .sub-title { font-weight: 600; font-size: 19px; fill: url(#cyanBlueGrad); letter-spacing: 0.5px; }
      .desc-text { font-weight: 400; font-size: 14.5px; fill: #94a3b8; line-height: 1.6; }
      .pill-text { font-weight: 600; font-size: 12px; fill: #e2e8f0; }
      .handle-text { font-weight: 700; font-size: 13px; fill: #38bdf8; }
    </style>
  </defs>

  <!-- Container Box with Rounded Edges -->
  <rect x="1" y="1" width="998" height="318" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Ambient Glow Effects -->
  <circle cx="150" cy="90" r="180" fill="url(#glowLeft)" filter="url(#softGlow)"/>
  <circle cx="850" cy="220" r="200" fill="url(#glowRight)" filter="url(#softGlow)"/>
  <circle cx="500" cy="160" r="160" fill="url(#glowCenter)" filter="url(#softGlow)"/>

  <!-- Subtle Cyber Grid Background Lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="64" x2="1000" y2="64"/>
    <line x1="0" y1="128" x2="1000" y2="128"/>
    <line x1="0" y1="192" x2="1000" y2="192"/>
    <line x1="0" y1="256" x2="1000" y2="256"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
  </g>

  <!-- Top Rainbow Accent Ribbon -->
  <path d="M 21 1 L 979 1 Q 999 1 999 21 L 999 5 L 1 5 L 1 21 Q 1 1 21 1 Z" fill="url(#ribbonGrad)"/>
  <rect x="0" y="0" width="1000" height="4" fill="url(#ribbonGrad)" rx="2"/>

  <!-- GitHub Tag Top Right -->
  <g transform="translate(770, 32)">
    <rect width="180" height="34" rx="17" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <circle cx="22" cy="17" r="5" fill="#10b981"/>
    <text x="36" y="22" class="font-mono handle-text">@deadxfire</text>
    <text x="135" y="22" font-size="12" fill="#64748b" class="font-sans">PRO</text>
  </g>

  <!-- Main Content Layout -->
  <!-- Left Greeting Tag -->
  <g transform="translate(56, 44)">
    <rect width="168" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <text x="14" y="19" class="font-sans" font-size="12.5" font-weight="600" fill="#38bdf8">⚡ SYSTEMS ARCHITECT</text>
  </g>

  <!-- Main Name Title -->
  <text x="56" y="118" class="font-sans title-name">Arindam Makar</text>

  <!-- Subtitle -->
  <text x="56" y="152" class="font-sans sub-title">Creator of Rinswa Browser • Low-Level Systems &amp; Security Engineer</text>

  <!-- Description paragraph -->
  <text x="56" y="186" class="font-sans desc-text">Building privacy-hardened runtimes, multi-process Gecko engine architecture,</text>
  <text x="56" y="208" class="font-sans desc-text">high-performance C++ systems, and native developer toolchains for Windows.</text>

  <!-- Badge Pills Row -->
  <g transform="translate(56, 246)">
    <!-- Pill 1: Rinswa Browser -->
    <g transform="translate(0, 0)">
      <rect width="182" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="14" y="20" class="font-sans pill-text">🌐 Rinswa Browser v1.0.4</text>
    </g>

    <!-- Pill 2: Gecko 157+ Engine -->
    <g transform="translate(194, 0)">
      <rect width="176" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="14" y="20" class="font-sans pill-text">⚡ Gecko Engine Fork</text>
    </g>

    <!-- Pill 3: Zero Telemetry -->
    <g transform="translate(382, 0)">
      <rect width="184" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2"/>
      <text x="14" y="20" class="font-sans pill-text">🛡️ Zero-Telemetry Hardened</text>
    </g>

    <!-- Pill 4: Native C++ / Windows -->
    <g transform="translate(578, 0)">
      <rect width="172" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="14" y="20" class="font-sans pill-text">💻 Native C++ &amp; Rust</text>
    </g>

    <!-- Pill 5: Tarakeswar, IN -->
    <g transform="translate(762, 0)">
      <rect width="144" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#64748b" stroke-width="1.2"/>
      <text x="14" y="20" class="font-sans pill-text">📍 India</text>
    </g>
  </g>

  <!-- Bottom Accent Ribbon Line -->
  <rect x="0" y="316" width="1000" height="4" fill="url(#ribbonGrad)" rx="2"/>
</svg>
